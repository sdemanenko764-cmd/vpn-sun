# Builds the Windows portable EXE from the published source archive on a real
# Windows/MSVC runner and commits EXE, ZIP and SHA-256 files next to it.
name: Sun VPN Windows release
on:
  push:
    branches: [claude/continue-previous-work-o4e9fl]
    paths: [downloads/Sun-VPN-*-source.zip, .github/workflows/windows-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify and unpack source archive
        id: source
        shell: pwsh
        run: |
          # Checkout gives every file the same mtime: pick the highest version by name.
          $zip = Get-ChildItem downloads/Sun-VPN-*-source.zip |
            Sort-Object { [version]($_.Name -replace '^Sun-VPN-(.+)-source\.zip$', '$1') } |
            Select-Object -Last 1
          $expected = (Get-Content "$($zip.FullName).sha256").Split(' ')[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source archive SHA-256 mismatch" }
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP\src"
          $version = (Get-Content "$env:RUNNER_TEMP\src\Sun-VPN\package.json" | ConvertFrom-Json).version
          if ($zip.Name -ne "Sun-VPN-$version-source.zip") { throw "Archive name does not match version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test and build
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\src\Sun-VPN\scripts\build-windows-portable.ps1"'
      - name: Check executable and package
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          $name = "Sun-VPN-$env:VERSION-Windows-x64"
          $exe = "$env:RUNNER_TEMP\src\Sun-VPN\artifacts\$name.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Not x64' }
          if ([BitConverter]::ToUInt16($bytes, $pe + 24 + 68) -ne 2) { throw 'Not a GUI executable' }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          $imports
          if ($imports -match '^(WebView2Loader|vcruntime|msvcp|libgcc|libwinpthread)') { throw 'Unexpected runtime DLL dependency' }
          Copy-Item $exe "downloads\$name.exe"
          $staging = "$env:RUNNER_TEMP\zip"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item $exe "$staging\$name.exe"
          @("Sun VPN $env:VERSION Windows x64",
            'Закройте предыдущую версию. Распакуйте архив и запустите EXE.',
            'Для TUN нужны права администратора и установленный WebView2 Runtime.',
            'Обновите подписки после запуска.') | Set-Content "$staging\READ-ME.txt" -Encoding utf8
          Compress-Archive "$staging\*" "downloads\$name.zip" -Force
          foreach ($file in @("$name.exe", "$name.zip")) {
            $hash = (Get-FileHash "downloads\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$PWD\downloads\$file.sha256", "$hash  $file`n")
            Get-Content "downloads\$file.sha256"
          }
      - name: Commit binaries
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          git config user.name 'Sun VPN release automation'
          git config user.email 'sun-vpn-build@users.noreply.github.com'
          git add downloads
          git commit -m "Publish Sun VPN $env:VERSION Windows binaries (built on windows-latest, MSVC)"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
